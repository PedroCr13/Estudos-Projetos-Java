<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud Cidades Login</title>

    <link rel ="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container-fluid">
        <section class="col-md-12 d-flex jutisfy-content mt-5">
            <div class="card">
                <div class="card-header bg-primary text-white">Dados para o login</div>
                <div class="card-body">
                    <form method="POST">
                        <div class="form-group">
                            <label for="usuario">Usuário:</label>
                            <input name="username" type="text" class="form-control" placeholder="Informe o usuario" 
                                id="usuario">
                        </div>

                        <div class="form-group">
                            <label for="usuario">Senha:</label>
                            <input name="password" type="password" class="form-control" placeholder="Informe a senha" 
                                id="senha">
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
 </body>

</html>
