<div class="container">

  {{ 'departamentos' | lowercase}}

  <div class="grid p-5">
    <div class="col-12">
      <h1 class="m-0" style="color: #ffa31a">Departamentos</h1>
    </div>

    <div class="col-12 md:col-12 field flex flex-column gap-2">
      <label for="departamento" class="font-bold">Departamento</label>
      <input pInputText id="departamento" type="text" />
    </div>

    <div class="col-12 md:col-6 field flex flex-column gap-2">
      <p-button type="submit" label="Buscar">

      </p-button>
    </div>
  </div>

  <div class="grid">
    <div class="col-12">
      <p-table [value]="departamentos" [paginator]="true" [rows]="5"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Exibindo de {first} a {last} de {totalRecords} registros">
          <ng-template pTemplate="header">
            <tr>
              <th class="col-id">Id</th>
              <th>Nome</th>
              <th class="col-acoes"></th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-departamento>
              <tr>
                <td class="col-id">{{ departamento.id }}</td>
                <td>{{ departamento.nomeDepartamento }}</td>
                <td [ngStyle]="{color: departamento.nomeDepartamento === 'TI' ? '#7BA399' : '#495057'}">{{ departamento.departamento }}</td>

                <td class="col-acoes">
                  <a pButton icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top"></a>
                  <button pButton icon="pi pi-trash" pTooltip="Excluir" tooltipPosition="top"></button>
                </td>

              </tr>
          </ng-template>
      </p-table>
    </div>
  </div>



<div>

  <div class="col-12">
    <a pButton label="Novo Departamento"></a>
  </div>

</div>
