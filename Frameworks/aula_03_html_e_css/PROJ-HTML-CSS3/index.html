<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Pós Graduação em Java - UTFPR</title>
        <link rel="stylesheet" href="css/bootstrap-grid-min.css">
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/layout.css">
        <link rel="stylesheet" href="css/components.css">
    </head>

    <body>
        <header class="layout-cabecalho">
            <div class="container">
                <img src="images/logo_da_utfpr.jpg" width="90" height="65" alt="Logo da UTFPR">

        <section class="layout-banner">
            <div class="container">

                    <h1 class="banner__titulo">PÓS GRADUAÇÃO EM JAVA DA UTFPR</h1>
                    <p class="banner__subtitulo">É tecnológica. É federal. É para você.</p>
                    
                    <div class="baner__conhecer">
                       <a href="#disciplinas" class="botao botao--conhecer">Conheça as disciplinas</a>
                    </div>
                </div>

            </div>
        </section>

        <div id="disciplinas" class="layout-disciplinas">
            <div class="container">
                
                <!-- linha  --->
                <div class="row">

                    <!-- coluna ocupando 4 posições da grid (bootstrap)  --->
                    <div class="col-sm-4">

                        <article class="disciplina">
                            <h2 class="disciplina__tiulo">Java I</h2>
                            <div class="disciplina__logo">
                                <img src="images/java1.jpg" width="100" height="180" alt="Java I">
                            </div>
                            <footer class="disciplina__rodape">
                                <a href="conteudo-java-1.html" class="botao botao--conteudo">Conteúdo</a>
                            </footer>
                        </article>

                    </div>

                    <!-- linha ocupando 4 colunas -->
                    <div class="col-sm-4">
                        
                        <article class="disciplina">
                            <h2 class="disciplina__tiulo">Java 2</h2>
                            <div class="disciplina__logo">
                                <img src="images/java2.jpg" width="100" height="180" alt="Java II">
                            </div>
                            <footer class="disciplina__rodape">
                                <a href="conteudo-java-2.html" class="botao botao--conteudo">Conteúdo</a>
                            </footer>
                        </article>

                    </div>
                    
                    <!-- linha ocupando 4 colunas -->
                    <div class="col-sm-4">

                        <article class="disciplina">
                            <h2 class="disciplina__tiulo">UML</h2>
                            <div class="disciplina__logo">
                                <img src="images/uml.jpg" width="130" height="180" alt="UML">
                            </div>
                            <footer class="disciplina__rodape">
                                <a href="conteudo-uml.html" class="botao botao--conteudo">Conteúdo</a>
                            </footer>

                </div>
