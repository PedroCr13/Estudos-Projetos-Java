<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h2>Testando Message Driven</h2>
        <h:form>
            Utilizando Queue
            <br/>
            Mensagem: 
            <h:inputText id="mensagemFila" value = "#{jsfProdQ.mensagem}" />
            <br/>
            Quantidade de vezes que deseja enviar:
            <h:inputText id="qtdMsgfila" value="#{jsfProdQ.quantidade}" />
            <br/>
            <h:commandButton id="btFila" value="Enviar" action="#{jsfProdQ.send()}" />
        </h:form>
    </h:body>
